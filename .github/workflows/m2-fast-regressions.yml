name: M2 fast synthetic backend regressions
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/m2-fast-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Run all isolated clinical and privacy regressions
        working-directory: HMR Desk/engine
        run: |
          python -m pytest -q test_app_paths.py test_db_migrations.py test_template_report_builder.py test_report_auth.py test_clinical_routes.py test_clinical_snapshot.py test_visual_compare.py test_manual_foundation.py test_clinical_privacy.py test_service_static_security.py test_backup_bundle.py test_reconciliation_review.py test_medicine_scenarios.py test_pathology_records.py test_pathology_import.py test_offline_helpers.py test_local_referral_extraction.py test_referral_identity.py test_referral_variants.py test_interview_intake_review.py test_clinical_review_pages.py test_backup_template.py test_db_encryption.py test_dev_seed.py test_template_table_format.py test_template_prototype.py test_medicine_reference.py test_records.py test_followup_context.py


      - name: Medicine reference data synthetic tests (no network, no patient data)
        run: python -m unittest discover -s "HMR Desk/engine/tests/medicine_data" -v
      - name: Measure synthetic searchable 5/15/50-page referral throughput
        run: python scripts/bench-referral.py
      - name: Upload synthetic Windows intake performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-synthetic-intake-performance
          path: m2-referral-performance.json
          if-no-files-found: error
          retention-days: 7

  desktop:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop source syntax
        shell: pwsh
        run: |
          $files = @('desktop/main.js', 'desktop/preload.js')
          $files += @(Get-ChildItem desktop/src,desktop/renderer -Recurse -Filter '*.js' -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw ('JavaScript syntax check failed: ' + $file) }
          }
      - name: Fast Electron unit regressions
        working-directory: desktop
        run: |
          npm ci
          npm test


  ui-visual-synthetic:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Electron dev tools
        working-directory: desktop
        run: npm ci
      - name: Exercise synthetic desktop screens and 125/150 percent layout
        working-directory: desktop
        run: npm run shots
      - name: Upload synthetic-only visual/accessibility audit
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-synthetic-ui-layout-audit
          path: desktop/shots/
          if-no-files-found: error
          retention-days: 7
