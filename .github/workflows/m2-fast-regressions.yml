name: M2 fast synthetic backend regressions
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/m2-fast-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Run all isolated clinical and privacy regressions
        working-directory: HMR Desk/engine
        run: |
          python -m pytest -q test_app_paths.py test_db_migrations.py test_template_report_builder.py test_report_auth.py test_clinical_routes.py test_manual_foundation.py test_clinical_privacy.py test_service_static_security.py test_backup_bundle.py test_reconciliation_review.py test_medicine_scenarios.py test_pathology_records.py test_pathology_import.py test_offline_helpers.py test_local_referral_extraction.py test_referral_identity.py
