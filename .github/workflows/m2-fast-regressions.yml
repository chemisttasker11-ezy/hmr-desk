name: M2 fast synthetic backend regressions
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/m2-fast-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Run all isolated clinical and privacy regressions
        working-directory: HMR Desk/engine
        run: |
          python -m pytest -q test_app_paths.py test_db_migrations.py test_template_report_builder.py test_report_auth.py test_report_signoff_consent.py test_followup_review_untick.py test_clinical_routes.py test_clinical_snapshot.py test_visual_compare.py test_manual_foundation.py test_clinical_privacy.py test_service_static_security.py test_backup_bundle.py test_reconciliation_review.py test_medicine_scenarios.py test_pathology_records.py test_pathology_values.py test_candidate_checks.py test_full_flow_integrity.py test_pathology_import.py test_offline_helpers.py test_local_referral_extraction.py test_referral_identity.py test_referral_variants.py test_interview_intake_review.py test_clinical_review_pages.py test_backup_template.py test_db_encryption.py test_dev_seed.py test_template_table_format.py test_template_prototype.py test_optional_gp_plan.py test_gp_practice_details.py test_report_refresh_recommendations.py test_report_held_actions.py test_snapshot_contract_compat.py test_handover_safety.py test_medicine_reference.py test_amt_rf2_rows.py test_records.py test_records_stamp_order.py test_referral_recovery_real_intake.py test_reconciliation_reack.py test_followup_context.py test_medicine_snapshot.py test_medicine_suggestions.py test_suggestion_evidence.py test_reference_library.py test_brainstorm_citations.py test_reference_matches.py test_brainstorm_tables.py test_brainstorm_tables_lookup.py test_report.py test_report_actual_use.py test_report_assist_saved.py test_service_empty_post.py test_ppa_consent_held.py test_route_ownership.py test_pdf_export_diagnostics.py test_pdf_converter_resolution.py test_report_request_date.py test_self_test_pdf.py test_service_unhandled_error.py test_folder_check.py test_legacy_scripts.py test_patient_actions.py test_build_snapshot.py test_clinical_privacy_directions.py test_followup_api.py test_followup_rules.py test_maintenance.py test_referral_allergy_nil.py test_report_demographics.py test_report_refresh_out_path.py test_report_save_revision.py test_stopped_overlap_contract.py test_claims_data.py test_claim_prep.py test_report_status.py test_report_status_unreadable_referral.py test_original_builder_adapter.py test_original_builder_jobs.py test_original_builder_publication.py test_suggest_template_mentions.py


      - name: Referral intake preparation synthetic regressions
        working-directory: HMR Desk/engine
        run: |
          python -m pytest -q test_referral_entry.py::ReferralEntryTests test_referral_entry.py::IntakeInterviewPreparationTests
      - name: Medicine reference data synthetic tests (no network, no patient data)
        run: python -m unittest discover -s "HMR Desk/engine/tests/medicine_data" -v
      - name: Measure synthetic searchable 5/15/50-page referral throughput
        run: python scripts/bench-referral.py
      - name: Upload synthetic Windows intake performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-synthetic-intake-performance
          path: m2-referral-performance.json
          if-no-files-found: error
          retention-days: 7

  desktop:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop source syntax
        shell: pwsh
        run: |
          $files = @('desktop/main.js', 'desktop/preload.js')
          $files += @(Get-ChildItem desktop/src,desktop/renderer -Recurse -Filter '*.js' -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw ('JavaScript syntax check failed: ' + $file) }
          }
      - name: Fast Electron unit regressions
        working-directory: desktop
        run: |
          npm ci
          npm test


  ui-visual-synthetic:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Electron dev tools
        working-directory: desktop
        run: npm ci
      - name: Exercise synthetic desktop screens and 125/150 percent layout
        working-directory: desktop
        run: npm run shots
      - name: Upload synthetic-only visual/accessibility audit
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-synthetic-ui-layout-audit
          path: desktop/shots/
          if-no-files-found: error
          retention-days: 7
