name: Pathology safety focused synthetic verification
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/pathology_*'
      - 'HMR Desk/engine/test_pathology_*'
      - 'HMR Desk/engine/routes_clinical_records.py'
      - 'desktop/renderer/interview.js'
      - '.github/workflows/pathology-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies and test runner
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Run strict pathology parser, provenance, records and source-image tests
        working-directory: HMR Desk/engine
        run: |
          python -m pytest -q test_pathology_proposals.py test_pathology_realistic_layouts.py test_pathology_records.py test_pathology_import.py
      - name: Check pharmacist review renderer syntax
        run: node --check desktop/renderer/interview.js
