name: M2 Windows standalone engineering verification
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/m2-standalone.yml'
  workflow_dispatch:

concurrency:
  group: m2-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build-time dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Isolated synthetic backend regressions
        working-directory: HMR Desk/engine
        run: python -m pytest -q test_app_paths.py test_db_migrations.py test_template_report_builder.py test_report_auth.py test_clinical_routes.py test_clinical_snapshot.py test_visual_compare.py test_manual_foundation.py test_clinical_privacy.py test_service_static_security.py test_backup_bundle.py test_reconciliation_review.py test_medicine_scenarios.py test_pathology_records.py test_pathology_import.py test_offline_helpers.py test_local_referral_extraction.py test_referral_identity.py test_referral_variants.py test_interview_intake_review.py test_clinical_review_pages.py test_backup_template.py test_db_encryption.py test_dev_seed.py test_template_table_format.py test_template_prototype.py test_optional_gp_plan.py test_gp_practice_details.py test_report_refresh_recommendations.py test_report_held_actions.py test_snapshot_contract_compat.py test_handover_safety.py test_original_builder_adapter.py test_original_builder_jobs.py test_original_builder_publication.py test_suggest_template_mentions.py test_brainstorm_asset_packaging.py test_brainstorm_tables_lookup.py
      - name: Medicine reference data synthetic tests
        run: python -m unittest discover -s "HMR Desk/engine/tests/medicine_data" -v
      - name: Electron unit tests
        working-directory: desktop
        run: |
          npm ci
          npm test
      - name: Ensure Electron binary is installed
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'Electron binary missing after npm ci; running electron install script'
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw 'Electron install script failed' }
          }
          if (-not (Test-Path $exe)) {
            Get-ChildItem node_modules/electron -Force | Format-Table Name
            throw 'Electron binary still not installed'
          }
          & $exe --version
      - name: Real Windows DPAPI protected synthetic draft crash/restart
        shell: pwsh
        run: ./scripts/smoke-dpapi.ps1
      - name: Stage tracked Brainstorm assets with shared local and CI tool
        run: python scripts/prepare-brainstorm-assets.py stage
      - name: Build Windows x64 frozen Python engine
        working-directory: HMR Desk/engine
        run: python -m PyInstaller --clean --noconfirm hmr-engine.spec
      - name: Verify frozen engine Brainstorm assets match the tracked source
        run: python scripts/prepare-brainstorm-assets.py verify "HMR Desk/engine/dist/hmr-engine"
      - name: Smoke actual frozen engine without Python subprocess runtime
        run: python scripts/smoke-packaged-engine.py "HMR Desk/engine/dist/hmr-engine/hmr-engine.exe"
      - name: Restore verified LibreOffice MSI cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\hmr-libreoffice-msi
          key: libreoffice-msi-ecdb65e76f5e91dc198b8c8dce5b5d6e1eb12fea6023553e52b591afd10b619d
      - name: Bundle pinned, checksum-verified offline PDF converter
        shell: pwsh
        env:
          HMR_LIBREOFFICE_MSI_CACHE: ${{ runner.temp }}\hmr-libreoffice-msi
        run: ./scripts/bundle-libreoffice.ps1
      - name: Convert a real synthetic DOCX and verify offline PDF
        run: python scripts/smoke-pdf.py
      - name: Frozen engine converts a synthetic DOCX detached with closed stdin
        run: python scripts/smoke-frozen-pdf.py "HMR Desk/engine/dist/hmr-engine/hmr-engine.exe"
      - name: Synthetic short and long template-bound DOCX-to-PDF layout regression
        run: python scripts/smoke-template-pdf.py
      - name: Synthetic referral-to-signed-and-sent HMR journey (real PDF, DOCX and offline PDF)
        working-directory: HMR Desk/engine
        env:
          HMR_REQUIRE_PDF_CONVERTER: '1'
        run: python -m pytest -q -rs test_synthetic_patient_journey.py
      - name: Build NSIS installer with engine resources
        working-directory: desktop
        run: npm run dist
      - name: Verify packaged Electron engine Brainstorm assets
        run: python scripts/prepare-brainstorm-assets.py verify "desktop/dist/win-unpacked/resources/engine/hmr-engine"
      - name: Check that standalone engine is packed in installed resources
        shell: pwsh
        run: |
          $engine = 'desktop/dist/win-unpacked/resources/engine/hmr-engine/hmr-engine.exe'
          if (-not (Test-Path $engine)) { throw 'NSIS application missing Python engine' }
          $converter = 'desktop/dist/win-unpacked/resources/converter/libreoffice/program/soffice.exe'
          if (-not (Test-Path $converter)) { throw 'NSIS application missing offline DOCX-PDF converter' }
          Get-FileHash $engine -Algorithm SHA256 | Format-List
          Get-FileHash $converter -Algorithm SHA256 | Format-List
      - name: Smoke packaged desktop and owned engine with Python and Node absent from PATH
        shell: pwsh
        run: ./scripts/smoke-packaged-desktop.ps1
      - name: Generate unsigned installer SHA256 and resource manifest
        shell: pwsh
        env:
          HMR_MERGE_SHA: ${{ github.sha }}
          HMR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/manifest-windows.ps1
      - name: Package separate app archive for isolated acceptance without NSIS
        run: python scripts/pack-acceptance.py
      - name: Upload unsigned app archive (no install, synthetic acceptance only)
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-isolated-acceptance-app
          path: |
            desktop/dist/hmr-isolated-acceptance.zip
            desktop/dist/hmr-isolated-acceptance.zip.sha256
            desktop/dist/hmr-isolated-acceptance.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned engineering artifact (not clinical release)
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-windows-unsigned-engineering-build
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/SHA256SUMS.txt
            desktop/dist/installer-manifest.json
          if-no-files-found: error
          retention-days: 7

  installed-smoke:
    # Partial clean-machine evidence only: a fresh hosted runner, silent
    # per-user NSIS install, launch from the installed location with Python
    # and Node removed from PATH. Not a Windows 11 non-admin client acceptance test.
    needs: windows-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: hmr-m2-windows-unsigned-engineering-build
          path: installer
      - name: Silent per-user install of the built installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer artifact missing' }
          Write-Host ('Installing ' + $setup.Name)
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw ('Installer exit code ' + $p.ExitCode) }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'HMR Desk.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Installed HMR Desk.exe not found under LOCALAPPDATA' }
          Write-Host ('Installed at ' + $exe.FullName)
          "HMR_SMOKE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify reference assets in actual silent-installed app
        shell: pwsh
        run: |
          $engineFolder = Join-Path (Split-Path $env:HMR_SMOKE_EXE -Parent) 'resources\engine\hmr-engine'
          python scripts/prepare-brainstorm-assets.py verify $engineFolder
          if ($LASTEXITCODE -ne 0) { throw 'Installed Brainstorm reference assets failed verification' }
      - name: Boot installed app, verify engine, crash recovery and clean exit
        shell: pwsh
        run: ./scripts/smoke-packaged-desktop.ps1
