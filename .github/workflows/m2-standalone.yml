name: M2 Windows standalone engineering verification
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/m2-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build-time dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Isolated synthetic backend regressions
        working-directory: HMR Desk/engine
        run: python -m pytest -q test_app_paths.py test_manual_foundation.py test_clinical_privacy.py test_service_static_security.py test_backup_bundle.py test_reconciliation_review.py
      - name: Electron unit tests
        working-directory: desktop
        run: |
          npm ci
          npm test
      - name: Build Windows x64 frozen Python engine
        working-directory: HMR Desk/engine
        run: python -m PyInstaller --clean --noconfirm hmr-engine.spec
      - name: Smoke actual frozen engine without Python subprocess runtime
        run: python scripts/smoke-packaged-engine.py "HMR Desk/engine/dist/hmr-engine/hmr-engine.exe"
      - name: Build NSIS installer with engine resources
        working-directory: desktop
        run: npm run dist
      - name: Check that standalone engine is packed in installed resources
        shell: pwsh
        run: |
          $engine = 'desktop/dist/win-unpacked/resources/engine/hmr-engine/hmr-engine.exe'
          if (-not (Test-Path $engine)) { throw 'NSIS application missing Python engine' }
          Get-FileHash $engine -Algorithm SHA256 | Format-List
      - name: Upload unsigned engineering artifact (not clinical release)
        uses: actions/upload-artifact@v4
        with:
          name: hmr-m2-windows-unsigned-engineering-build
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 7
