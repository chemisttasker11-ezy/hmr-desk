name: Clinical privacy contract
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/clinical_privacy.py'
      - 'HMR Desk/engine/test_clinical_privacy.py'
      - 'HMR Desk/engine/jobs.py'
      - 'HMR Desk/engine/steps.py'
      - 'HMR Desk/engine/settings.py'
      - 'HMR Desk/engine/service.py'
      - 'HMR Desk/engine/test_service_static_security.py'
      - '.github/workflows/clinical-privacy.yml'
  workflow_dispatch:

jobs:
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile modified engine modules
        working-directory: HMR Desk/engine
        run: python -m py_compile clinical_privacy.py jobs.py steps.py settings.py service.py
      - name: Privacy projection and local server regression tests
        working-directory: HMR Desk/engine
        run: python -m pytest -q test_clinical_privacy.py test_service_static_security.py
