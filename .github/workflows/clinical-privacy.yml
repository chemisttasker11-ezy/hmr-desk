name: Clinical privacy contract
on:
  pull_request:
    paths:
      - 'HMR Desk/engine/clinical_privacy.py'
      - 'HMR Desk/engine/test_clinical_privacy.py'
      - 'HMR Desk/engine/conftest.py'
      - 'HMR Desk/engine/test_legacy_signoff_fixture.py'
      - 'HMR Desk/engine/jobs.py'
      - 'HMR Desk/engine/api.py'
      - 'HMR Desk/engine/report.py'
      - 'HMR Desk/engine/manual_defaults.py'
      - 'HMR Desk/engine/reconciliation.py'
      - 'HMR Desk/engine/local_report_builder.py'
      - 'HMR Desk/engine/test_manual_foundation.py'
      - 'HMR Desk/engine/steps.py'
      - 'HMR Desk/engine/settings.py'
      - 'HMR Desk/engine/service.py'
      - 'HMR Desk/engine/test_service_static_security.py'
      - '.github/workflows/clinical-privacy.yml'
  workflow_dispatch:

jobs:
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest python-docx sqlcipher3-wheels==0.5.7
      - name: Compile modified engine modules
        working-directory: HMR Desk/engine
        run: python -m py_compile clinical_privacy.py jobs.py steps.py settings.py service.py api.py report.py manual_defaults.py reconciliation.py local_report_builder.py
      - name: Privacy projection and local server regression tests
        working-directory: HMR Desk/engine
        run: python -m pytest -q test_clinical_privacy.py test_service_static_security.py test_manual_foundation.py test_legacy_signoff_fixture.py
